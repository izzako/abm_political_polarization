[DATA_PATH]
text_data = data/text_data_sentiment_topics.parquet
author_data = data/author_data.parquet
interaction_data= data/interaction_data.parquet

[PROMPT_PATH]
prompt_path=prompts/option_b

[SIMULATION]
data_start_datetime = 2024-02-01 00:00:00
data_end_datetime = 2024-02-29 00:00:00
track_every = 100
topic_num = 0
timeframe_init = 7

[MODEL]
model_name = nvidia/Llama-3.1-Nemotron-Nano-8B-v1
temperature = 0.6
inference_server_url = http://localhost:8000/v1

[AGENTS]
INIT_OPINION_NORMALIZATION = 0.8
learning_rate = 0.5