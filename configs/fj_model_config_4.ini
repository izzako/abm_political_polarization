[DATA_PATH]
text_data = data/text_data_sentiment_topics.parquet
author_data = data/author_data.parquet
interaction_data = data/interaction_data.parquet

[SIMULATION]
init_days = 14
topic_num = 4
end_datetime = 2024-02-29

[MODEL]
model = Friedkin-Johnsen
tolerance = 1e-06
interaction_retweet_weights = 0.1
interaction_reply_weights_pos = 0.1
interaction_reply_weights_neutral = 0.0
interaction_reply_weights_neg = 0
stubbornness_retweet_weights = 0.1
stubbornness_reply_weights = 0.1
mae0 = 0.0552466666666666

